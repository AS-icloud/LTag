<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Luggage Tag Info</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #f1f5f9;
  min-height: 100vh;
  padding: 0 0 40px 0;
}

.header {
  background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
  padding: 40px 20px 30px;
  text-align: center;
  border-bottom: 1px solid #1e293b;
}
.header .icon { font-size: 48px; margin-bottom: 10px; }
.header h1 { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
.header p { font-size: 13px; color: #64748b; }

.card {
  background: #1e293b;
  border-radius: 16px;
  margin: 16px;
  overflow: hidden;
  border: 1px solid #334155;
}

.field {
  display: flex;
  align-items: flex-start;
  padding: 16px;
  border-bottom: 1px solid #1e293b;
  gap: 14px;
  background: #1e293b;
  text-decoration: none;
  color: inherit;
  transition: background .15s;
}
.field:last-child { border-bottom: none; }
.field:active { background: #273549; }
a.field { cursor: pointer; }

.field-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
}
.field-icon.blue   { background: rgba(56,189,248,.15); color: #38bdf8; }
.field-icon.green  { background: rgba(52,211,153,.15); color: #34d399; }
.field-icon.purple { background: rgba(167,139,250,.15); color: #a78bfa; }
.field-icon.orange { background: rgba(251,146,60,.15); color: #fb923c; }
.field-icon.red    { background: rgba(248,113,113,.15); color: #f87171; }
.field-icon.teal   { background: rgba(45,212,191,.15); color: #2dd4bf; }

.field-body { flex: 1; min-width: 0; }
.field-label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
.field-value { font-size: 16px; color: #f1f5f9; font-weight: 500; word-break: break-word; line-height: 1.4; }
.field-hint  { font-size: 11px; color: #38bdf8; margin-top: 3px; }
.map-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 16px; background:#1e293b; }
.map-btn { display:block; text-align:center; text-decoration:none; color:#f8fafc; background:#2563eb; border-radius:12px; padding:13px 8px; font-size:14px; font-weight:800; }
.map-btn.apple { background:#334155; }
.map-btn:active { transform:scale(.98); }

.copy-btn {
  display: block;
  width: calc(100% - 32px);
  margin: 20px 16px 0;
  background: #38bdf8;
  color: #0f172a;
  border: none;
  border-radius: 14px;
  padding: 18px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: .3px;
  -webkit-appearance: none;
  transition: background .15s, transform .1s;
}
.copy-btn:active { background: #0ea5e9; transform: scale(.98); }
.copy-btn.done { background: #34d399; }

.empty {
  text-align: center;
  padding: 60px 30px;
  color: #475569;
}
.empty .e-icon { font-size: 56px; margin-bottom: 16px; }
.empty h2 { font-size: 20px; color: #64748b; margin-bottom: 8px; }
.empty p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <div class="icon">🏷️</div>
  <h1>Luggage Tag</h1>
  <p>Scan to view contact &amp; travel info</p>
</div>

<div id="content"></div>

<script>
// Parse URL data param
function getParam(name) {
  var u = new URLSearchParams(window.location.search);
  return u.get(name);
}

// A "baked" standalone copy of this file (see the designer app's "Generate info page"
// button) embeds the data directly as window.__BAKED_DATA, so the QR that points here
// can just be a short fixed URL instead of a long ?d=... query string. Falls back to
// the query string exactly as before when there's no baked data.
var raw = (typeof window.__BAKED_DATA !== 'undefined') ? window.__BAKED_DATA : getParam('d');
if (!raw) raw = '';

// Try to detect and parse structured data
// Format: key:value pairs separated by newlines or |
// Keys: name, phone, email, address, url, note, flight, bag
// Or just plain text

function detectType(text) {
  if (/^BEGIN:VCARD/i.test(text)) return 'vcard';
  if (/^WIFI:/.test(text)) return 'wifi';
  if (/^https?:\/\//i.test(text)) return 'url';
  if (/\|/.test(text) || /\n[a-z]+:/i.test(text)) return 'structured';
  return 'text';
}

function parseStructured(text) {
  // Support both | separators and newline key:value
  var fields = [];
  var lines = text.split(/[\n|]+/);
  lines.forEach(function(line) {
    line = line.trim();
    if (!line) return;
    var m = line.match(/^([^:]+):\s*(.+)$/);
    if (m) {
      fields.push({ key: m[1].trim().toLowerCase(), value: m[2].trim() });
    } else {
      fields.push({ key: 'note', value: line });
    }
  });
  return fields;
}

function parseVCard(text) {
  var fields = [];
  var fn  = text.match(/FN:(.+)/i);
  var tel = text.match(/TEL[^:]*:(.+)/i);
  var em  = text.match(/EMAIL[^:]*:(.+)/i);
  var org = text.match(/ORG:(.+)/i);
  var adr = text.match(/ADR[^:]*:(.+)/i);
  var url = text.match(/URL:(.+)/i);
  if (fn)  fields.push({key:'name',    value: fn[1].trim()});
  if (org) fields.push({key:'org',     value: org[1].trim()});
  if (tel) fields.push({key:'phone',   value: tel[1].trim()});
  if (em)  fields.push({key:'email',   value: em[1].trim()});
  if (adr) fields.push({key:'address', value: adr[1].replace(/;+/g,' ').trim()});
  if (url) fields.push({key:'url',     value: url[1].trim()});
  return fields;
}

// Field renderer
var iconMap = {
  name:     ['person','blue'],
  org:      ['building','purple'],
  phone:    ['landline','red'],
  mobile:   ['smartphone','green'],
  whatsapp: ['whatsapp','green'],
  email:    ['email','blue'],
  address:  ['pin','orange'],
  url:      ['link','teal'],
  website:  ['globe','teal'],
  flight:   ['flight','blue'],
  bag:      ['bag','purple'],
  note:     ['note','purple'],
  ref:      ['key','red'],
  hotel:    ['hotel','orange'],
  booking:  ['booking','teal'],
};

var AT_PATH = 'M1902 755Q1902 569 1844.5 418.5Q1787 268 1684.5 186.0Q1582 104 1455 104Q1356 104 1302.0 148.0Q1248 192 1248 280L1251 350H1245Q1179 227 1081.5 165.5Q984 104 871 104Q714 104 627.5 206.0Q541 308 541 489Q541 653 605.5 794.0Q670 935 786.0 1018.0Q902 1101 1043 1101Q1262 1101 1344 919H1350L1389 1079H1545L1429 573Q1392 409 1392 320Q1392 226 1473 226Q1553 226 1620.5 295.0Q1688 364 1727.0 485.0Q1766 606 1766 753Q1766 932 1689.0 1070.5Q1612 1209 1467.0 1283.5Q1322 1358 1128 1358Q886 1358 700.0 1251.0Q514 1144 408.0 942.5Q302 741 302 491Q302 298 380.5 150.5Q459 3 607.5 -76.0Q756 -155 954 -155Q1099 -155 1248.0 -117.5Q1397 -80 1557 7L1612 -105Q1467 -192 1297.5 -237.5Q1128 -283 954 -283Q713 -283 532.5 -187.5Q352 -92 256.5 84.5Q161 261 161 491Q161 771 285.5 1000.0Q410 1229 631.0 1356.5Q852 1484 1126 1484Q1367 1484 1542.0 1393.5Q1717 1303 1809.5 1138.0Q1902 973 1902 755ZM1296 747Q1296 849 1230.0 911.5Q1164 974 1054 974Q953 974 874.5 910.5Q796 847 751.0 734.5Q706 622 706 491Q706 371 753.5 303.0Q801 235 900 235Q1025 235 1129.0 340.0Q1233 445 1273 602Q1296 694 1296 747Z';

function iconSvg(name) {
  var icons = {
    person:   '<circle cx="12" cy="8" r="3.5"/><path d="M3 20c0-4.4 4-8 9-8s9 3.6 9 8"/>',
    building: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 21V9h6v12"/><path d="M3 9h18"/>',
    landline: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 8.81 19.8 19.8 0 0 1 1 4.11 2 2 0 0 1 2.96 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    smartphone:'<rect x="5" y="1" width="14" height="22" rx="2"/><line x1="12" y1="18" x2="12" y2="18.5" stroke-width="3"/>',
    whatsapp: '<circle cx="12" cy="12" r="9" fill="#25d366" stroke="#25d366"/><path d="M8.6 9.2c.2 3.4 2.8 5.8 6.2 6.2l1.1-1.6c.2-.3.1-.7-.2-.9l-1.5-.8c-.3-.2-.7-.1-.9.2l-.4.6c-1.1-.5-1.9-1.3-2.4-2.4l.6-.4c.3-.2.4-.6.2-.9l-.8-1.5c-.2-.3-.6-.4-.9-.2L8.6 9.2Z" stroke="#fff"/>',
    email:    '<g transform="translate(12,12) scale(0.010187,-0.010187) translate(-1031.5,-600.5)" fill="white" stroke="none"><path d="' + AT_PATH + '"/></g>',
    pin:      '<path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/>',
    link:     '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    globe:    '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    flight:   '<path d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5S18 2 16.5 3.5L13 7 4.8 5.2 3.4 6.6 8 10l-1 3-3-1-1.4 1.4 4 4 4 4 1.4-1.4-1-3 3-1 3.6 4.6z"/>',
    bag:      '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    note:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>',
    key:      '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
    hotel:    '<path d="M3 22V12h18v10"/><path d="M21 12V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4"/><rect x="9" y="16" width="6" height="6"/><path d="M3 2h18"/>',
    booking:  '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>',
  };
  var d = icons[name] || icons.note;
  var fill = name === 'email' ? 'currentColor' : 'none';
  return '<svg viewBox="0 0 24 24" width="18" height="18" fill="' + fill + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
}
var labelMap = {
  name:'Name', org:'Organisation', phone:'Phone', mobile:'Mobile',
  whatsapp:'WhatsApp',
  email:'Email', address:'Address', url:'Website', website:'Website',
  flight:'Flight', bag:'Bag / Description', note:'Note',
  ref:'Reference', hotel:'Hotel', booking:'Booking Ref',
};

function fieldHTML(key, value) {
  var baseKey = key.replace(/2$/,'');
  var isSecond = baseKey !== key;
  var ic = iconMap[baseKey] || ['📌','blue'];
  var lb = (labelMap[baseKey] || (baseKey.charAt(0).toUpperCase() + baseKey.slice(1))) + (isSecond ? ' 2' : '');
  var hint = '';
  var tag = 'div', href = '', extraAttr = '';

  function internationalNumber(v) {
    var cleaned = v.trim();
    if (/^\+/.test(cleaned)) cleaned = cleaned.replace(/\s*\(0\)\s*/, ' ');
    return cleaned.replace(/[^\d+]/g,'');
  }
  if (baseKey === 'phone' || baseKey === 'mobile') {
    tag = 'a'; href = 'tel:' + internationalNumber(value);
    hint = '<div class="field-hint">Tap to call</div>';
  } else if (baseKey === 'whatsapp') {
    tag = 'a';
    href = 'https://wa.me/' + internationalNumber(value).replace(/\D/g,'');
    extraAttr = ' target="_blank" rel="noopener"';
    hint = '<div class="field-hint">Tap to open WhatsApp</div>';
  } else if (baseKey === 'email') {
    tag = 'a'; href = 'mailto:' + value;
    hint = '<div class="field-hint">Tap to email</div>';
  } else if (baseKey === 'address') {
    hint = '<div class="field-hint">Choose Apple Maps or Google Maps below</div>';
  } else if (baseKey === 'url' || baseKey === 'website') {
    tag = 'a'; href = value.match(/^https?:\/\//) ? value : 'https://'+value;
    extraAttr = ' target="_blank" rel="noopener"';
    hint = '<div class="field-hint">Tap to open</div>';
  }

  var open = tag === 'a'
    ? '<a class="field" href="' + href + '"' + extraAttr + '>'
    : '<div class="field">';
  var close = tag === 'a' ? '</a>' : '</div>';

  return open +
    '<div class="field-icon ' + ic[1] + '">' + iconSvg(ic[0]) + '</div>' +
    '<div class="field-body">' +
      '<div class="field-label">' + lb + '</div>' +
      '<div class="field-value">' + escHtml(value) + '</div>' +
      hint +
    '</div>' +
    close;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Build plain-text fallback — CAPS label as visual substitute for bold
function buildClipText(fields) {
  return fields.map(function(f) {
    var base=f.key.replace(/2$/,''),lb=(labelMap[base]||base)+(base!==f.key?' 2':'');
    lb=lb.toUpperCase();
    return lb + '\n' + f.value;
  }).join('\n\n');
}

// Build HTML version — label bold, value plain, zero hyperlinks
function buildClipHtml(fields) {
  var rows = fields.map(function(f) {
    var base=f.key.replace(/2$/,'');
    var label=(labelMap[base]||(base.charAt(0).toUpperCase()+base.slice(1)))+(base!==f.key?' 2':'');
    var lb = escHtml(label);
    var val = escHtml(f.value);
    return '<b>' + lb + '</b><br>' + val;
  }).join('<br><br>');
  return '<!DOCTYPE html><html><body><p style="font-family:sans-serif;font-size:14px;line-height:1.6">' + rows + '</p></body></html>';
}

// Render
var content = document.getElementById('content');

if (!raw) {
  content.innerHTML =
    '<div class="empty">' +
    '<div class="e-icon">🔍</div>' +
    '<h2>No data found</h2>' +
    '<p>This QR code doesn\'t contain any information. Please check the generator settings.</p>' +
    '</div>';
} else {
  var fields = [];
  var type = detectType(raw);

  if (type === 'vcard') {
    fields = parseVCard(raw);
  } else if (type === 'structured') {
    fields = parseStructured(raw);
  } else if (type === 'url') {
    fields = [{key:'url', value: raw}];
  } else {
    // Plain text — split by newlines into note fields
    var lines = raw.split('\n').filter(function(l){ return l.trim(); });
    if (lines.length === 1) {
      fields = [{key:'note', value: raw.trim()}];
    } else {
      // Try to detect key:value in plain text
      fields = parseStructured(raw);
      if (!fields.length) fields = [{key:'note', value: raw.trim()}];
    }
  }

  var html = '<div class="card">';
  fields.forEach(function(f) {
    html += fieldHTML(f.key, f.value);
    if (f.key.replace(/2$/,'') === 'address') {
      var mapQuery = encodeURIComponent(f.value);
      html += '<div class="map-actions">' +
        '<a class="map-btn apple" href="https://maps.apple.com/?q=' + mapQuery + '" target="_blank" rel="noopener">Apple Maps</a>' +
        '<a class="map-btn" href="https://maps.google.com/maps?q=' + mapQuery + '" target="_blank" rel="noopener">Google Maps</a>' +
      '</div>';
    }
  });
  html += '</div>';

  var clipText = buildClipText(fields);
  var clipHtml  = buildClipHtml(fields);

  html +=
    '<button class="copy-btn" id="copyBtn" onclick="copyAll()">' +
    'Copy All to Clipboard' +
    '</button>';

  content.innerHTML = html;

  window.copyAll = function() {
    var btn = document.getElementById('copyBtn');

    function showDone() {
      btn.textContent = 'Copied!';
      btn.classList.add('done');
      setTimeout(function(){ btn.textContent = 'Copy All to Clipboard'; btn.classList.remove('done'); }, 2500);
    }

    var plainBlob = new Blob([clipText], { type: 'text/plain' });
    var htmlBlob  = new Blob([clipHtml],  { type: 'text/html' });

    // Write both HTML (bold labels, no links) and plain-text fallback in one ClipboardItem.
    // Apps that support rich paste (Notes, Word, Pages) use the HTML → bold headers.
    // Apps that don't (plain editors, SMS) fall back to the plain-text version.
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': plainBlob })])
        .then(showDone)
        .catch(function() {
          // ClipboardItem failed (e.g. non-HTTPS or browser restriction) — try plain writeText
          navigator.clipboard.writeText(clipText).then(showDone).catch(fallback);
        });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(clipText).then(showDone).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = clipText;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ta.setSelectionRange(0, 99999);
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      showDone();
    }
  };
}
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
